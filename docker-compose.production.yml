# ============================================================================
# Docker Compose Configuration for PRODUCTION
# ============================================================================
# This file contains production-specific configuration
# Use: docker-compose -f docker-compose.production.yml up -d
# ============================================================================

version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: logistics-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-logistics}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-logistics_main}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - logistics-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_main"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: logistics-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data_prod:/data
    ports:
      - "6379:6379"
    networks:
      - logistics-network-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # API Gateway Service
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/api-gateway/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-api-gateway-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://yourdomain.com}
      - SERVICE_NAME=api-gateway
      # Service URLs for proxy routing
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - WALLET_SERVICE_URL=http://wallet-service:3006
      - SUPPORT_SERVICE_URL=http://support-service:3007
      - PLATFORM_SERVICE_URL=http://platform-service:3008
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - logistics-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: ./backend/auth-service/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-auth-service-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logistics_auth
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_EXPIRES_IN=604800
    ports:
      - "3002:3002"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # User Service
  user-service:
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-user-service-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logistics_users
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3002
    ports:
      - "3003:3003"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network-prod
    profiles:
      - all-services
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Shipment Service
  shipment-service:
    build:
      context: .
      dockerfile: backend/shipment-service/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-shipment-service-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - SERVICE_NAME=shipment-service
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logistics_shipments
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - WALLET_SERVICE_URL=http://wallet-service:3006
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - PARTNER_SERVICE_EXTERNAL_URL=${PARTNER_SERVICE_EXTERNAL_URL}
    ports:
      - "3004:3004"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network-prod
    profiles:
      - all-services
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Partner Service
  partner-service:
    build:
      context: .
      dockerfile: backend/partner-service/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-partner-service-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logistics_partners
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      - PARTNER_SERVICE_EXTERNAL_URL=${PARTNER_SERVICE_EXTERNAL_URL}
      - SERVICE_ID=${PARTNER_SERVICE_ID}
      - HMAC_SECRET=${PARTNER_HMAC_SECRET}
      - API_SECRET_SALT=${PARTNER_API_SECRET_SALT}
    ports:
      - "3005:3005"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network-prod
    profiles:
      - all-services
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Wallet Service
  wallet-service:
    build:
      context: .
      dockerfile: backend/wallet-service/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-wallet-service-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logistics_wallet
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      - EXTERNAL_WALLET_API_URL=${EXTERNAL_WALLET_API_URL}
      - EXTERNAL_WALLET_SECRET_KEY=${EXTERNAL_WALLET_SECRET_KEY}
      - EXTERNAL_WALLET_USER_ID=${EXTERNAL_WALLET_USER_ID}
    ports:
      - "3006:3006"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network-prod
    profiles:
      - all-services
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Support Service
  support-service:
    build:
      context: .
      dockerfile: backend/support-service/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-support-service-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3007
      - SERVICE_NAME=support-service
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logistics_support
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
    ports:
      - "3007:3007"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network-prod
    profiles:
      - all-services
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Platform Service
  platform-service:
    build:
      context: .
      dockerfile: backend/platform-service/Dockerfile
      args:
        NODE_ENV: production
    container_name: logistics-platform-service-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3008
      - SERVICE_NAME=platform-service
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logistics_platforms
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
    ports:
      - "3008:3008"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network-prod
    profiles:
      - all-services
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: logistics-frontend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - logistics-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  logistics-network-prod:
    driver: bridge

# ============================================================================
# PRODUCTION DEPLOYMENT COMMANDS
# ============================================================================
#
# Start all services:
#   docker-compose -f docker-compose.production.yml --profile all-services up -d
#
# Stop all services:
#   docker-compose -f docker-compose.production.yml --profile all-services down
#
# View logs:
#   docker-compose -f docker-compose.production.yml logs -f
#
# Restart specific service:
#   docker-compose -f docker-compose.production.yml restart auth-service
#
# Scale service:
#   docker-compose -f docker-compose.production.yml up -d --scale api-gateway=3
#
# Check status:
#   docker-compose -f docker-compose.production.yml ps
#
# ============================================================================
