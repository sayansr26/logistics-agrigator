services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: logistics-postgres-dev
    environment:
      - POSTGRES_USER=logistics
      - POSTGRES_PASSWORD=logistics123
      - POSTGRES_DB=logistics_main
    ports:
      - "3009:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logistics-redis-dev
    ports:
      - "3010:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: logistics-api-gateway-dev
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: pnpm run dev

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: ./backend/auth-service/Dockerfile
    container_name: logistics-auth-service-dev
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=3600
      - JWT_REFRESH_EXPIRES_IN=604800
    ports:
      - "3002:3002"
    volumes:
      - ./backend/auth-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: pnpm run dev

  # User Service (Development Ready)
  user-service:
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
    container_name: logistics-user-service-dev
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_users
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
    ports:
      - "3003:3003"
    volumes:
      - ./backend/user-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend-network
    command: pnpm run dev

  # Shipment Service (Future)
  shipment-service:
    build:
      context: .
      dockerfile: ./backend/shipment-service/Dockerfile
    container_name: logistics-shipment-service-dev
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_shipments
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - WALLET_SERVICE_URL=http://wallet-service:3006
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - PARTNER_SERVICE_EXTERNAL_URL=https://calc.websiteduniya.com
    ports:
      - "3004:3004"
    volumes:
      - ./backend/shipment-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

  # Partner Service (Week 2+ Development)
  partner-service:
    build:
      context: .
      dockerfile: ./backend/partner-service/Dockerfile
    container_name: logistics-partner-service-dev
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_partners
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      # External Partner Micro Service Configuration
      - PARTNER_SERVICE_EXTERNAL_URL=https://calc.websiteduniya.com
      - PARTNER_SERVICE_API_KEY=your_super_secret_hmac_key_minimum_32_characters
      # Partner Micro Service Authentication (HMAC SHA-256)
      - SERVICE_ID=TESTING_1
      - HMAC_SECRET=hmac_super_secret_key_2024_partner_services
      - API_SECRET_SALT=api_secret_salt_2024_partner_services
      - PARTNER_SERVICE_TIMEOUT=5000
      - PARTNER_SERVICE_RETRY_ATTEMPTS=3
      - PARTNER_SERVICE_CACHE_TTL=300
      # External courier API configurations
      - DELHIVERY_API_URL=https://track.delhivery.com/api/cmu/push/json
      - DELHIVERY_API_TOKEN=your-delhivery-api-token
      - BLUEDART_API_URL=https://api.bluedart.com
      - BLUEDART_API_TOKEN=your-bluedart-api-token
      - DTDC_API_URL=https://blktracksvc.dtdc.com
      - DTDC_API_TOKEN=your-dtdc-api-token
      - ECOM_EXPRESS_API_URL=https://api.ecomexpress.in
      - ECOM_EXPRESS_API_TOKEN=your-ecom-express-api-token
    ports:
      - "3005:3005"
    volumes:
      - ./backend/partner-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

  # Wallet Service (Critical - Required for Shipment Service)
  wallet-service:
    build:
      context: .
      dockerfile: ./backend/wallet-service/Dockerfile
    container_name: logistics-wallet-service-dev
    environment:
      - NODE_ENV=development
      - PORT=3006
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_wallet
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      # External Wallet API Configuration
      - EXTERNAL_WALLET_API_URL=https://wapi.websiteduniya.com/api/v1
      - EXTERNAL_WALLET_SECRET_KEY=production-hmac-secret-key-256-bit-minimum-ultra-secure-change-me
      - EXTERNAL_WALLET_USER_ID=wallet-service
      - EXTERNAL_WALLET_JWT_TOKEN=
      # JWT Configuration
      - JWT_EXPIRES_IN=3600
      - JWT_REFRESH_EXPIRES_IN=2592000
      # Default Client Configuration
      - DEFAULT_CLIENT_CODE=DEFAULT
      # Cache Configuration
      - CACHE_WALLET_TTL=600
      - CACHE_BALANCE_TTL=300
      - CACHE_TRANSACTIONS_TTL=60
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_TIMEOUT=30000
      - CIRCUIT_BREAKER_ERROR_THRESHOLD=50
      - CIRCUIT_BREAKER_RESET_TIMEOUT=60000
      # Rate Limiting Configuration
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=1000
      - RATE_LIMIT_STRICT_MAX=50
      - RATE_LIMIT_BALANCE_MAX=100
      - RATE_LIMIT_TRANSACTION_MAX=30
    ports:
      - "3006:3006"
    volumes:
      - ./backend/wallet-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

  # Support Service (Future)
  support-service:
    build:
      context: .
      dockerfile: ./backend/support-service/Dockerfile
    container_name: logistics-support-service-dev
    environment:
      - NODE_ENV=development
      - PORT=3007
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_support
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
    ports:
      - "3007:3007"
    volumes:
      - ./backend/support-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

  # Platform Service (Future)
  platform-service:
    build:
      context: .
      dockerfile: ./backend/platform-service/Dockerfile
    container_name: logistics-platform-service-dev
    environment:
      - NODE_ENV=development
      - PORT=3008
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_platforms
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      - SHOPIFY_CLIENT_ID=your_shopify_client_id
      - SHOPIFY_CLIENT_SECRET=your_shopify_client_secret
    ports:
      - "3008:3008"
    volumes:
      - ./backend/platform-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

volumes:
  postgres_data:
  redis_data:

networks:
  backend-network:
    driver: bridge
# Usage Examples:
# pnpm run dev:backend              # Start core backend services
# pnpm run dev:backend:full         # Start all backend services (including future ones)
