version: "3.8"

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: logistics-postgres-dev
    environment:
      - POSTGRES_USER=logistics
      - POSTGRES_PASSWORD=logistics123
      - POSTGRES_DB=logistics_main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logistics-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: logistics-api-gateway-dev
    environment:
      - NODE_ENV=development
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: pnpm run dev

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: ./backend/auth-service/Dockerfile
    container_name: logistics-auth-service-dev
    environment:
      - NODE_ENV=development
      - PORT=8001
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=3600
      - JWT_REFRESH_EXPIRES_IN=604800
    ports:
      - "8001:8001"
    volumes:
      - ./backend/auth-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: pnpm run dev

  # User Service (Development Ready)
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: logistics-user-service-dev
    environment:
      - NODE_ENV=development
      - PORT=8002
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_users
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:8001
    ports:
      - "8002:8002"
    volumes:
      - ./backend/user-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend-network
    command: pnpm run dev

  # Shipment Service (Future)
  shipment-service:
    build:
      context: ./backend/shipment-service
      dockerfile: Dockerfile
    container_name: logistics-shipment-service-dev
    environment:
      - NODE_ENV=development
      - PORT=8003
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_shipments
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
    ports:
      - "8003:8003"
    volumes:
      - ./backend/shipment-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

  # Support Service (Future)
  support-service:
    build:
      context: ./backend/support-service
      dockerfile: Dockerfile
    container_name: logistics-support-service-dev
    environment:
      - NODE_ENV=development
      - PORT=8004
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_support
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:8001
    ports:
      - "8004:8004"
    volumes:
      - ./backend/support-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

  # Platform Service (Future)
  platform-service:
    build:
      context: ./backend/platform-service
      dockerfile: Dockerfile
    container_name: logistics-platform-service-dev
    environment:
      - NODE_ENV=development
      - PORT=8005
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_platforms
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
    ports:
      - "8005:8005"
    volumes:
      - ./backend/platform-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: pnpm run dev
    profiles:
      - future-services

volumes:
  postgres_data:
  redis_data:

networks:
  backend-network:
    driver: bridge
# Usage Examples:
# pnpm run dev:backend              # Start core backend services
# pnpm run dev:backend:full         # Start all backend services (including future ones)
