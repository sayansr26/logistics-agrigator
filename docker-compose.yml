services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: logistics-postgres
    environment:
      - POSTGRES_USER=logistics
      - POSTGRES_PASSWORD=logistics123
      - POSTGRES_DB=logistics_main
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    # Port removed for security - accessible only within Docker network
    expose:
      - "5432"
    networks:
      - logistics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Port removed for security - accessible only within Docker network
    expose:
      - "6379"
    networks:
      - logistics-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Gateway Service
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/api-gateway/Dockerfile
    container_name: logistics-api-gateway
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
      - SERVICE_NAME=api-gateway
      # Service URLs for proxy routing
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - WALLET_SERVICE_URL=http://wallet-service:3006
      - SUPPORT_SERVICE_URL=http://support-service:3007
      - PLATFORM_SERVICE_URL=http://platform-service:3008
      - LICENSE_SERVICE_URL=http://license-service:3011
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    ports:
      - "3001:3001"
    volumes:
      - ./backend/api-gateway:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - logistics-network
    command: pnpm run dev

  # Auth Service with Prisma (Core Service)
  auth-service:
    build:
      context: .
      dockerfile: ./backend/auth-service/Dockerfile
    container_name: logistics-auth-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_EXPIRES_IN=604800
      # Inter-service communication (direct within Docker network)
      - USER_SERVICE_URL=http://user-service:3003
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3002"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/auth-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - auth_service_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-network

  # User Service (Week 2 Development)
  user-service:
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
    container_name: logistics-user-service
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_users
      - AUTH_DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      # Inter-service communication secret (must match auth-service)
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3003"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/user-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - shipment_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - user-service

  # Shipment Service (Week 3+ Development)
  shipment-service:
    build:
      context: .
      dockerfile: backend/shipment-service/Dockerfile
    container_name: logistics-shipment-service
    environment:
      - NODE_ENV=development
      - PORT=3004
      - SERVICE_NAME=shipment-service
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_shipments
      - AUTH_DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - WALLET_SERVICE_URL=http://wallet-service:3006
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - PARTNER_SERVICE_EXTERNAL_URL=https://calc.websiteduniya.com
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3004"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/shipment-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - shipment_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - shipment-service

  # Partner Service (Week 2+ Development)
  partner-service:
    build:
      context: .
      dockerfile: backend/partner-service/Dockerfile
    container_name: logistics-partner-service
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_partners
      - AUTH_DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      # External Partner Micro Service Configuration
      - PARTNER_SERVICE_EXTERNAL_URL=https://calc.websiteduniya.com
      - PARTNER_SERVICE_API_KEY=your_super_secret_hmac_key_minimum_32_characters
      - EXTERNAL_COURIER_TIMEOUT=15000
      # Partner Micro Service Authentication (HMAC SHA-256)
      - SERVICE_ID=TESTING_1
      - HMAC_SECRET=hmac_super_secret_key_2024_partner_services
      - API_SECRET_SALT=api_secret_salt_2024_partner_services
      - PARTNER_SERVICE_TIMEOUT=5000
      - PARTNER_SERVICE_RETRY_ATTEMPTS=3
      - PARTNER_SERVICE_CACHE_TTL=300
      # External courier API configurations
      - DELHIVERY_API_URL=https://track.delhivery.com/api/cmu/push/json
      - BLUEDART_API_URL=https://apigateway.bluedart.com
      - DTDC_API_URL=https://blktracksvc.dtdc.com
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3005"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/partner-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - partner_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - partner-service

  # Wallet Service (CRITICAL - Required for Shipment Service)
  wallet-service:
    build:
      context: .
      dockerfile: backend/wallet-service/Dockerfile
    container_name: logistics-wallet-service
    environment:
      - NODE_ENV=development
      - PORT=3006
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_wallet
      - AUTH_DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - PARTNER_SERVICE_URL=http://partner-service:3005
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      # External Wallet API Configuration
      - EXTERNAL_WALLET_API_URL=https://wapi.websiteduniya.com/api/v1
      - EXTERNAL_WALLET_SECRET_KEY=production-hmac-secret-key-256-bit-minimum-ultra-secure-change-me
      - EXTERNAL_WALLET_USER_ID=wallet-service
      - EXTERNAL_WALLET_JWT_TOKEN=
      # JWT Configuration
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_EXPIRES_IN=2592000
      # Default Client Configuration
      - DEFAULT_CLIENT_CODE=DEFAULT
      # Cache Configuration
      - CACHE_WALLET_TTL=600
      - CACHE_BALANCE_TTL=300
      - CACHE_TRANSACTIONS_TTL=60
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_TIMEOUT=30000
      - CIRCUIT_BREAKER_ERROR_THRESHOLD=50
      - CIRCUIT_BREAKER_RESET_TIMEOUT=60000
      # Rate Limiting Configuration
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=1000
      - RATE_LIMIT_STRICT_MAX=50
      - RATE_LIMIT_BALANCE_MAX=100
      - RATE_LIMIT_TRANSACTION_MAX=30
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3006"
    # For live reload in development, enable these volumes:
    volumes:
      - ./backend/wallet-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - wallet_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - wallet-service
      - future-services

  # Support Service (Week 4+ Development)
  support-service:
    build:
      context: .
      dockerfile: backend/support-service/Dockerfile
    container_name: logistics-support-service
    environment:
      - NODE_ENV=development
      - PORT=3007
      - SERVICE_NAME=support-service
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_support
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3007"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/support-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - shipment_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - support-service

  # Platform Service (Week 5+ Development)
  platform-service:
    build:
      context: .
      dockerfile: backend/platform-service/Dockerfile
    container_name: logistics-platform-service
    environment:
      - NODE_ENV=development
      - PORT=3008
      - SERVICE_NAME=platform-service
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_platforms
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - SHIPMENT_SERVICE_URL=http://shipment-service:3004
      - SHOPIFY_CLIENT_ID=your_shopify_client_id
      - SHOPIFY_CLIENT_SECRET=your_shopify_client_secret
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3008"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/platform-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - platform_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - platform-service

  # License Service (Critical for client licensing and activation)
  license-service:
    build:
      context: .
      dockerfile: backend/license-service/Dockerfile
    container_name: logistics-license-service
    environment:
      - NODE_ENV=development
      - PORT=3011
      - SERVICE_NAME=license-service
      - DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_license
      - AUTH_DATABASE_URL=postgresql://logistics:logistics123@postgres:5432/logistics_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_EXPIRES_IN=604800
      # License encryption keys
      - LICENSE_SECRET_KEY=ultra-secure-license-key-min-32-chars-required-change-in-prod
      - LICENSE_SIGNING_KEY=signing-key-for-license-validation-hmac-sha256-change-in-prod
      # Service URLs
      - AUTH_SERVICE_URL=http://auth-service:3002
      - USER_SERVICE_URL=http://user-service:3003
      - INTERNAL_SERVICE_SECRET=internal-service-secret
      - INTERNAL_SECRET=internal-service-secret
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "3011"
    volumes:
      - ./backend/license-service:/app
      - ./shared:/app/shared
      # Container-only logs directory (no bidirectional sync to prevent nodemon restart loop)
      - license_logs:/app/logs
      - license_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - license-service

  # Frontend (Core Service)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logistics-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - logistics-network
    command: pnpm run dev

volumes:
  postgres_data:
  redis_data:
  api_gateway_node_modules:
  auth_service_node_modules:
  user_node_modules:
  shipment_node_modules:
  partner_node_modules:
  wallet_node_modules:
  support_node_modules:
  platform_node_modules:
  license_node_modules:
  license_logs:
  frontend_node_modules:
  frontend_next:

networks:
  logistics-network:
    driver: bridge
# 🚀 Development Commands:
#
# Core Services (default):
#   pnpm run dev                    # postgres + redis + api-gateway + auth-service + frontend
#
# Extended Development:
#   docker-compose --profile user-service up          # + user-service
#   docker-compose --profile shipment-service up      # + shipment-service
#   docker-compose --profile partner-service up       # + partner-service
#   docker-compose --profile wallet-service up        # + wallet-service
#   docker-compose --profile support-service up       # + support-service
#   docker-compose --profile platform-service up      # + platform-service
#   docker-compose --profile all-services up          # All services
#
# Specialized Docker Compose Files:
#   pnpm run dev:frontend          # Frontend-focused development
#   pnpm run dev:backend           # Backend-focused development
