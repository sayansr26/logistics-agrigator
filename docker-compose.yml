services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-logistics-postgres}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    # Port removed for security - accessible only within Docker network
    expose:
      - "${DB_PORT}"
    networks:
      - logistics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-logistics-redis}
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Port removed for security - accessible only within Docker network
    expose:
      - "${REDIS_PORT}"
    networks:
      - logistics-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Gateway Service
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/api-gateway/Dockerfile
    container_name: ${API_GATEWAY_CONTAINER_NAME:-logistics-api-gateway}
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${API_GATEWAY_PORT}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CROSS_ORIGIN}
      - SERVICE_NAME=${SERVICE_NAME}
      # Service URLs for proxy routing (using container names for internal access)
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}:${USER_SERVICE_PORT}
      - SHIPMENT_SERVICE_URL=http://${SHIPMENT_SERVICE_CONTAINER_NAME:-logistics-shipment-service}:${SHIPMENT_SERVICE_PORT}
      - PARTNER_SERVICE_URL=http://${PARTNER_SERVICE_CONTAINER_NAME:-logistics-partner-service}:${PARTNER_SERVICE_PORT}
      - WALLET_SERVICE_URL=http://${WALLET_SERVICE_CONTAINER_NAME:-logistics-wallet-service}:${WALLET_SERVICE_PORT}
      - SUPPORT_SERVICE_URL=http://${SUPPORT_SERVICE_CONTAINER_NAME:-logistics-support-service}:${SUPPORT_SERVICE_PORT}
      - PLATFORM_SERVICE_URL=http://${PLATFORM_SERVICE_CONTAINER_NAME:-logistics-platform-service}:${PLATFORM_SERVICE_PORT}
      - LICENSE_SERVICE_URL=http://${LICENSE_SERVICE_CONTAINER_NAME:-logistics-license-service}:${LICENSE_SERVICE_PORT}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    volumes:
      - ./backend/api-gateway:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - api-gateway

  # Auth Service with Prisma (Core Service)
  auth-service:
    build:
      context: .
      dockerfile: ./backend/auth-service/Dockerfile
    container_name: ${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${AUTH_SERVICE_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${AUTH_DATABASE_NAME:-logistics_auth}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      # Inter-service communication (direct within Docker network)
      - USER_SERVICE_URL=http://${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}:${USER_SERVICE_PORT}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway (3001)
    expose:
      - "${AUTH_SERVICE_PORT}"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/auth-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - auth_service_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-network
    profiles:
      - all-services
      - auth-service

  # User Service (Week 2 Development)
  user-service:
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
    container_name: ${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${USER_SERVICE_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${USER_DATABASE_NAME:-logistics_users}
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${AUTH_DATABASE_NAME:-logistics_auth}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}:${AUTH_SERVICE_PORT}
      # Inter-service communication secret (must match auth-service)
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway
    expose:
      - "${USER_SERVICE_PORT}"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/user-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - user_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - user-service

  # Shipment Service (Week 3+ Development)
  shipment-service:
    build:
      context: .
      dockerfile: backend/shipment-service/Dockerfile
    container_name: ${SHIPMENT_SERVICE_CONTAINER_NAME:-logistics-shipment-service}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${SHIPMENT_SERVICE_PORT}
      - SERVICE_NAME=${SHIPMENT_SERVICE_NAME:-shipment-service}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${SHIPMENT_DATABASE_NAME:-logistics_shipments}
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${AUTH_DATABASE_NAME:-logistics_auth}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}:${USER_SERVICE_PORT}
      - WALLET_SERVICE_URL=http://${WALLET_SERVICE_CONTAINER_NAME:-logistics-wallet-service}:${WALLET_SERVICE_PORT}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway
    expose:
      - "${SHIPMENT_SERVICE_PORT}"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/shipment-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - shipment_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - shipment-service

  # Partner Service (Week 2+ Development)
  partner-service:
    build:
      context: .
      dockerfile: backend/partner-service/Dockerfile
    container_name: ${PARTNER_SERVICE_CONTAINER_NAME:-logistics-partner-service}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PARTNER_SERVICE_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${PARTNER_DATABASE_NAME:-logistics_partners}
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${AUTH_DATABASE_NAME:-logistics_auth}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT}
      - SHIPMENT_SERVICE_URL=http://shipment-service:${SHIPMENT_SERVICE_PORT}
      # External courier API configurations
      - DELHIVERY_API_URL=${DELHIVERY_API_URL}
      - BLUEDART_API_URL=${BLUEDART_API_URL}
      - DTDC_API_URL=${DTDC_API_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway
    expose:
      - "${PARTNER_SERVICE_PORT}"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/partner-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - partner_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - partner-service

  # Wallet Service (CRITICAL - Required for Shipment Service)
  wallet-service:
    build:
      context: .
      dockerfile: backend/wallet-service/Dockerfile
    container_name: ${WALLET_SERVICE_CONTAINER_NAME:-logistics-wallet-service}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${WALLET_SERVICE_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${WALLET_DATABASE_NAME:-logistics_wallet}
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${AUTH_DATABASE_NAME:-logistics_auth}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}:${USER_SERVICE_PORT}
      - PARTNER_SERVICE_URL=http://${PARTNER_SERVICE_CONTAINER_NAME:-logistics-partner-service}:${PARTNER_SERVICE_PORT}
      - SHIPMENT_SERVICE_URL=http://${SHIPMENT_SERVICE_CONTAINER_NAME:-logistics-shipment-service}:${SHIPMENT_SERVICE_PORT}
      # External Wallet API Configuration
      - EXTERNAL_WALLET_API_URL=${EXTERNAL_WALLET_API_URL}
      - EXTERNAL_WALLET_SECRET_KEY=${EXTERNAL_WALLET_SECRET_KEY}
      - EXTERNAL_WALLET_USER_ID=${EXTERNAL_WALLET_USER_ID:-}
      - EXTERNAL_WALLET_JWT_TOKEN=${EXTERNAL_WALLET_JWT_TOKEN}
      # JWT Configuration
      - JWT_EXPIRES_IN=${WALLET_JWT_EXPIRES_IN:-8h}
      - JWT_REFRESH_EXPIRES_IN=${WALLET_JWT_REFRESH_EXPIRES_IN:-2592000}
      # Default Client Configuration
      - DEFAULT_CLIENT_CODE=${WALLET_DEFAULT_CLIENT_CODE:-DEFAULT}
      # Cache Configuration
      - CACHE_WALLET_TTL=${CACHE_WALLET_TTL:-600}
      - CACHE_BALANCE_TTL=${CACHE_BALANCE_TTL:-300}
      - CACHE_TRANSACTIONS_TTL=${CACHE_TRANSACTIONS_TTL:-60}
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_TIMEOUT=${CIRCUIT_BREAKER_TIMEOUT:-30000}
      - CIRCUIT_BREAKER_ERROR_THRESHOLD=${CIRCUIT_BREAKER_ERROR_THRESHOLD:-50}
      - CIRCUIT_BREAKER_RESET_TIMEOUT=${CIRCUIT_BREAKER_RESET_TIMEOUT:-60000}
      # Rate Limiting Configuration
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-1000}
      - RATE_LIMIT_STRICT_MAX=${RATE_LIMIT_STRICT_MAX:-50}
      - RATE_LIMIT_BALANCE_MAX=${RATE_LIMIT_BALANCE_MAX:-100}
      - RATE_LIMIT_TRANSACTION_MAX=${RATE_LIMIT_TRANSACTION_MAX:-30}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway
    expose:
      - "${WALLET_SERVICE_PORT}"
    # For live reload in development, enable these volumes:
    volumes:
      - ./backend/wallet-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - wallet_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - wallet-service

  # Support Service (Week 4+ Development)
  support-service:
    build:
      context: .
      dockerfile: backend/support-service/Dockerfile
    container_name: ${SUPPORT_SERVICE_CONTAINER_NAME:-logistics-support-service}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${SUPPORT_SERVICE_PORT}
      - SERVICE_NAME=${SUPPORT_SERVICE_NAME:-support-service}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${SUPPORT_DATABASE_NAME:-logistics_support}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}:${USER_SERVICE_PORT}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway
    expose:
      - "${SUPPORT_SERVICE_PORT}"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/support-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - support_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - support-service

  # Platform Service (Week 5+ Development)
  platform-service:
    build:
      context: .
      dockerfile: backend/platform-service/Dockerfile
    container_name: ${PLATFORM_SERVICE_CONTAINER_NAME:-logistics-platform-service}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PLATFORM_SERVICE_PORT}
      - SERVICE_NAME=${PLATFORM_SERVICE_NAME:-platform-service}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${PLATFORM_DATABASE_NAME:-logistics_platforms}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}:${USER_SERVICE_PORT}
      - SHIPMENT_SERVICE_URL=http://${SHIPMENT_SERVICE_CONTAINER_NAME:-logistics-shipment-service}:${SHIPMENT_SERVICE_PORT}
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway
    expose:
      - "${PLATFORM_SERVICE_PORT}"
    # For live reload in development, uncomment these volumes:
    volumes:
      - ./backend/platform-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - platform_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - platform-service

  # License Service (Critical for client licensing and activation)
  license-service:
    build:
      context: .
      dockerfile: backend/license-service/Dockerfile
    container_name: ${LICENSE_SERVICE_CONTAINER_NAME:-logistics-license-service}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${LICENSE_SERVICE_PORT}
      - SERVICE_NAME=${LICENSE_SERVICE_NAME:-license-service}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${LICENSE_DATABASE_NAME:-logistics_license}
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-logistics-postgres}:${DB_PORT}/${AUTH_DATABASE_NAME:-logistics_auth}
      - REDIS_URL=redis://${REDIS_CONTAINER_NAME:-logistics-redis}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${LICENSE_JWT_EXPIRES_IN:-8h}
      - JWT_REFRESH_EXPIRES_IN=${LICENSE_JWT_REFRESH_EXPIRES_IN:-604800}
      # License encryption keys
      - LICENSE_SECRET_KEY=${LICENSE_SECRET_KEY}
      - LICENSE_SIGNING_KEY=${LICENSE_SIGNING_KEY}
      # Service URLs
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_CONTAINER_NAME:-logistics-auth-service}:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://${USER_SERVICE_CONTAINER_NAME:-logistics-user-service}:${USER_SERVICE_PORT}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEVELOPMENT_ORIGINS=${DEVELOPMENT_ORIGINS}
      - PRODUCTION_ORIGINS=${PRODUCTION_ORIGINS}
      - STAGING_ORIGINS=${STAGING_ORIGINS}
    # Port removed for security - accessible only through API Gateway
    expose:
      - "${LICENSE_SERVICE_PORT}"
    volumes:
      - ./backend/license-service:/app
      - ./shared:/app/shared
      # Container-only logs directory (no bidirectional sync to prevent nodemon restart loop)
      - license_logs:/app/logs
      - license_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - license-service

  # Frontend (Core Service)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ${FRONTEND_CONTAINER_NAME:-logistics-frontend}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:${API_GATEWAY_PORT}}
      - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - logistics-network
    command: pnpm run dev
    profiles:
      - all-services
      - frontend

volumes:
  postgres_data:
  redis_data:
  api_gateway_node_modules:
  auth_service_node_modules:
  user_node_modules:
  shipment_node_modules:
  partner_node_modules:
  wallet_node_modules:
  support_node_modules:
  platform_node_modules:
  license_node_modules:
  license_logs:
  frontend_node_modules:
  frontend_next:

networks:
  logistics-network:
    driver: bridge