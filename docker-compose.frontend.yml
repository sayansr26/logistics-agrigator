services:
  # Frontend Development Only
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: logistics-frontend-dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_APP_ENV=development
      - NEXT_PUBLIC_TRACKING_URL=http://localhost:3000/track
    ports:
      - "3000:3000"
    # volumes: commented out to prevent permission issues
    # - ./frontend:/app
    # - /app/node_modules
    # - /app/.next
    networks:
      - frontend-network
    command: pnpm run dev
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

networks:
  frontend-network:
    driver: bridge
# Note: This setup assumes backend services are running separately
# Use this for frontend-only development when backend is deployed elsewhere
# or when working purely on UI components and styling
